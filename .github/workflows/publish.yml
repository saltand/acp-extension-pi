name: Publish to npm

# Manual only: run from the Actions tab. Builds the Windows native modules,
# repacks with them included, install-smokes the real tarball, then publishes
# @saltand/acp-extension-pi with the version already in package.json.
#
# Required secret: NPM_TOKEN (a classic automation token or granular token
# with publish rights for the @saltand scope).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/tag to publish (defaults to main)
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  windows-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: x64
          - os: windows-11-arm
            suffix: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.suffix }}
          path: native/*.node
          if-no-files-found: error

  publish:
    needs: windows-native
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke
      - uses: actions/download-artifact@v4
        with:
          pattern: release-native-*
          path: native
          merge-multiple: true
      - name: Require both Windows architectures
        run: pnpm prepublishOnly
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pi-package"
      - name: Install the packed tarball like an end user
        run: npm install --prefix "$RUNNER_TEMP/pi-install" --ignore-scripts --omit=dev "$RUNNER_TEMP"/pi-package/*.tgz
      - name: Smoke the installed package
        run: node scripts/smoke.mjs "$RUNNER_TEMP/pi-install/node_modules/@saltand/acp-extension-pi/dist/index.js"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm publish "$RUNNER_TEMP"/pi-package/*.tgz --access public
